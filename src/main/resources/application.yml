spring:
  application:
    name: backoffice
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/backoffice}
    username: ${DB_USERNAME:backoffice}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    version: OPENAPI_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha
  override-with-generic-response: false
